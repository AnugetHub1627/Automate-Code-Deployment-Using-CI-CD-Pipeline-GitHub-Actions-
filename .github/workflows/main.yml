#test
name: CI/CD pipeline

on:
  push:
    branches:
      - main

jobs:    # 1. Build Job: Handles testing and Docker image compilation
  build:
    name: pull and verify docker image
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: pull existing image from DockerHub 
        run: |
          docker pull anummdocker/namurepo09:jobnewsImage
      
      - name: Test container startup 
        run: |
          docker run -d --name test_app -p 8080:8080 namurepo09/jobnewsImage:latest
          sleep 5
          docker ps
          docker stop test_app

# 2. Deployment Job (Optional execution tracking or multi-tagging)
  deploy:
    name: tag and release Update
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push released version
        run: |
          docker pull namurepo09/jobnewsImage:latest
          docker tag namurepo09/jobnewsImage:latest namurepo09/jobnewsImage:${{ github.sha }}
          docker push namurepo09/jobnewsImage:${{ github.sha }}              
