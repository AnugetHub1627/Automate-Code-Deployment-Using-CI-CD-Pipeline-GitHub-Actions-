name: Node.js CI-CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'index.js'

jobs:
  # Job 1: Installs, tests, and validates code quality
  build:
    name: Test and Validate Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          

      - name: Install Project Dependencies
        run: npm npm install

      - name: Run Automated Test Suite
        run: npm test

  # Job 2: Packages application into Docker and ships it to DockerHub
  deploy:
    name: Build and Push Docker Image
    needs: build # This ensures deployment ONLY runs if all tests pass
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub Portal
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/node-web-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/node-web-app:${{ github.sha }}
